name: Scrape and Commit

on:
  schedule:
    - cron: '0 17 * * 4'
  workflow_dispatch:

jobs:
  scraper-and-commit:
    name: Run Scraper and Commit Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Config Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scraper

      - name: Upload scraped data for the next job
        uses: actions/upload-artifact@v6
        with:
          name: scraped-data
          path: src/db/db.json

      - name: Commit updated data
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          message: 'chore: update scraped data'
          add: 'src/db/db.json'

  deploy:
    needs: scraper-and-commit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download scraped data
        uses: actions/download-artifact@v6
        with:
          name: scraped-data
          path: src/db/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4