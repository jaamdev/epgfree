name: Scrape and Commit

on:
  schedule:
    - cron: '0 17 * * 4'
  workflow_dispatch:

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Config Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

  scrape-and-commit:
    name: Run Scraper and Commit Changes
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: write

    steps:
      - name: Run scraper script
        run: npm run scraper

      - name: Commit updated data
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          message: 'chore: update scraped data'
          add: 'src/db/db.json'

  deploy:
    name: Deploy to GitHub Pages
    needs: ['install', 'scrape-and-commit']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: 'pages'

    steps:
      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist